<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KCNA / KCSA 문제 은행</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--fg:#e6e6e6;--mute:#8b93a5;--ok:#2ea043;--bad:#d9534f;--acc:#c9a227;--sel:#2b3a55}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
header h1{font-size:16px;margin:0;color:var(--acc);white-space:nowrap}
header .header-inner{max-width:868px;margin:0 auto}
.header-top{display:flex;gap:10px;align-items:center}
#quizControls{display:grid;grid-template-columns:160px minmax(220px,1fr) auto;gap:8px;align-items:center;margin-top:8px}
#quizControls select,#quizControls button{min-height:44px}
#quizControls select{width:100%;min-width:0}
.study-settings{position:relative}
.study-settings>summary{min-height:44px;padding:10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--mute);white-space:nowrap}
.settings-panel{position:absolute;right:0;top:calc(100% + 8px);width:min(360px,calc(100vw - 32px));padding:16px;display:grid;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.settings-panel label{display:grid;gap:4px;color:var(--mute);font-size:12px}
.settings-panel select,.settings-panel button{min-height:44px;width:100%;min-width:0}
.settings-panel select{font-size:14px}
#reset{background:transparent;color:var(--mute)}
select,button{background:#1f232d;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover,select:hover{border-color:#3b4356}
button.primary{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
button:disabled{opacity:.45;cursor:default}
label.sw{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:13px}
main{max-width:900px;margin:0 auto;padding:16px 16px 80px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.stat{padding:0}
.stat b{display:block;font-size:16px}
.stat span{display:block;color:var(--mute);font-size:11px}
.stat:nth-child(n+4) b{color:var(--mute)}
.practice-note{margin:0 0 12px;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--mute);font-size:12px;margin-bottom:16px}
.meta .tag{border:1px solid var(--line);border-radius:5px;padding:2px 6px}
.meta .question-domain{flex:1;min-width:0}
.meta .question-id{font-size:11px;border:0;padding:0}
.meta .question-position{font-variant-numeric:tabular-nums}
.q{font-size:18px;line-height:1.65;margin:0 0 18px;white-space:pre-wrap}
.q .primary{display:block}
.translation{display:none;color:#cfd6e6;font-size:.94em;margin-top:3px}
.translation.visible{display:block}
.choices{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.choices li{border:1px solid var(--line);border-radius:8px;padding:13px 14px 13px 60px;min-height:60px;position:relative;cursor:pointer;background:#13161d;line-height:1.6}
.choices li:hover{border-color:#3b4356}
.choices li .k{position:absolute;left:12px;top:10px;width:22px;height:22px;border-radius:50%;background:#262b36;color:var(--mute);font-size:12px;display:flex;align-items:center;justify-content:center}
.choices li.sel{background:var(--sel);border-color:#4a6aa5}
.choices li.ok{border-color:var(--ok);background:rgba(46,160,67,.12)}
.choices li.bad{border-color:var(--bad);background:rgba(217,83,79,.12)}
.choices li.locked{cursor:default}
.explain{margin-top:14px;border-left:3px solid var(--acc);padding:8px 12px;background:#13161d;border-radius:0 8px 8px 0;display:none}
.explain.show{display:block}
.explain .verdict{font-weight:700;margin-bottom:6px}
.explain .verdict.ok{color:var(--ok)}.explain .verdict.bad{color:var(--bad)}
.explain a{color:#7aa7ff;font-size:13px;word-break:break-all}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:center}
.actions .hint{color:var(--mute);font-size:12px;margin-left:auto}
.language-buttons{display:flex;gap:4px;align-items:center;color:var(--mute);font-size:13px}
.language-buttons button[aria-pressed="true"]{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
.domains{margin-top:22px;display:grid;gap:6px}
.dom{display:grid;grid-template-columns:1fr 160px 70px;gap:10px;align-items:center;font-size:13px;color:var(--mute)}
.bar{height:8px;background:#262b36;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.timer{font-variant-numeric:tabular-nums;color:var(--acc);font-weight:600}
.result{margin-top:20px}
.result table{width:100%;border-collapse:collapse;font-size:14px}
.result td,.result th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.result td:not(:first-child){white-space:nowrap}
.result .review-item{border-top:1px solid var(--line);padding:12px 0}
.result .review-item .q{font-size:16px}
.result .review-actions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.result .review-answer{margin:4px 0;color:var(--mute)}
.result .review-item.translation-on .translation{display:block}
.history-list{margin-top:20px}
.history-row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.history-row span{color:var(--mute);font-size:13px}
.status{color:var(--mute);font-size:13px}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.hidden{display:none!important}
[hidden]{display:none!important}
.study-tabs{display:flex;gap:4px;margin-left:auto}
.study-tabs button{min-height:44px;padding:8px 12px;background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--mute)}
.study-tabs button[aria-selected="true"]{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
#vocabularyCount{font-size:12px}
body[data-view="vocabulary"] #quizControls,body[data-view="vocabulary"] #studySettings{display:none}
.vocabulary-word{display:inline;padding:0;margin:0;border:0;border-radius:2px;background:transparent;color:inherit;font:inherit;line-height:inherit;max-width:100%;overflow-wrap:anywhere;vertical-align:baseline}
.vocabulary-word.saved{text-decoration:underline dotted var(--mute);text-underline-offset:4px}
.vocabulary-word:hover{color:var(--acc);text-decoration:underline;text-underline-offset:4px}
.vocabulary-word:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.choices li button.k{left:8px;top:8px;width:44px;height:44px;padding:0;border:0;border-radius:6px;background:transparent;font-size:14px}
.vocabulary-notice{position:fixed;z-index:10;left:16px;right:16px;bottom:16px;max-width:600px;margin:0 auto;background:var(--panel);border:1px solid var(--acc);border-radius:8px;padding:12px 16px;pointer-events:none}
.vocabulary-toolbar,.vocabulary-actions,.vocabulary-entry-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vocabulary-toolbar input{flex:1;min-width:160px}
.vocabulary-toolbar{margin:18px 0}
.vocabulary-toolbar input,.vocabulary-meaning-form input{background:#1f232d;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:10px;font:inherit;min-height:44px}
#vocabularyPanel button,#vocabularyPanel select{min-height:44px}
.vocabulary-entry{border-top:1px solid var(--line);padding:18px 0}
.vocabulary-entry-head{justify-content:space-between}
.vocabulary-entry h3{margin:0}
.vocabulary-entry details{margin:12px 0}
.vocabulary-entry summary{cursor:pointer}
.vocabulary-meaning-form{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.vocabulary-meaning-form label{flex:1;min-width:160px}
.vocabulary-meaning-form input{display:block;width:100%;margin-top:4px}
.vocabulary-definition b{color:var(--mute);font-size:13px}
#vocabularyPanel a{color:#7aa7ff}
.vocabulary-study-word{font-size:30px;color:var(--acc);margin:8px 0}
.vocabulary-study-answer{border-left:3px solid var(--acc);padding-left:14px;margin:20px 0}
@media(max-width:600px){
  header{position:static;padding:8px 16px}
  header h1{font-size:14px}
  .header-top{gap:6px}
  .study-tabs{gap:2px}
  .study-tabs button{padding:8px;font-size:13px}
  .study-settings>summary{padding:10px 8px;font-size:12px}
  .timer{font-size:13px}
  #quizControls{grid-template-columns:repeat(2,minmax(0,1fr))}
  #quizControls #exam{grid-column:1;grid-row:1}
  #quizControls .language-buttons{grid-column:2;grid-row:1;justify-content:flex-end}
  #quizControls #mode{grid-column:1/-1;grid-row:2}
  .language-buttons{font-size:12px}
  .language-buttons button{padding:6px 8px;font-size:13px}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:8px}
  .card{padding:16px}
  .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .actions button,.actions select{min-height:44px;width:100%}
  .actions .hint{grid-column:1/-1;margin-left:0}
  .dom{grid-template-columns:1fr 90px 60px}
  .history-row{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="header-top">
      <h1>KCNA / KCSA</h1>
      <nav id="studyTabs" class="study-tabs" role="tablist" aria-label="학습 화면"><button id="quizTab" type="button" role="tab" aria-selected="true" aria-controls="quizPanel">퀴즈</button><button id="vocabularyTab" type="button" role="tab" aria-selected="false" aria-controls="vocabularyPanel" tabindex="-1">단어장 <span id="vocabularyCount">0</span></button></nav>
      <span id="timer" class="timer hidden"></span>
      <details id="studySettings" class="study-settings">
        <summary>설정</summary>
        <div class="settings-panel">
          <label>도메인<select id="domain"><option value="">전체 도메인</option></select></label>
          <label>문항 유형<select id="style"><option value="">전체 유형</option><option value="exam">객관식 연습</option><option value="study">심화형 (시나리오)</option></select></label>
          <button id="historyButton" type="button" aria-controls="history" aria-expanded="false">시험 기록</button>
          <button id="reset" type="button" title="이 시험의 진행 통계 삭제">통계 초기화</button>
        </div>
      </details>
    </div>
    <div id="quizControls">
      <select id="exam" aria-label="학습할 시험"><option value="local-kcna">KCNA</option><option value="local-kcsa">KCSA</option><option value="local">KCNA + KCSA</option></select>
      <select id="mode" aria-label="문제풀이 모드"><option value="endless">끝없이 (즉시 해설)</option><option value="wrong">오답만 다시</option><option value="exam">모의고사 60문항 / 90분</option></select>
      <span class="language-buttons" role="group" aria-label="번역 언어"><span>번역</span><button id="target-ko" type="button" aria-pressed="true">한국어</button><button id="target-en" type="button" aria-pressed="false">English</button></span>
    </div>
  </div>
</header>
<main>
  <div id="quizPanel" role="tabpanel" aria-labelledby="quizTab">
  <p class="status practice-note">학습용 연습문항 · 공식 기출·실전 난이도는 검증되지 않았습니다.</p>
  <div class="stats" id="stats"></div>
  <p id="seenNotice" class="status hidden" role="status"></p>
  <div class="card" id="card"></div>
  <div class="domains" id="domains"></div>
  <div class="result card hidden" id="result"></div>
  <div class="history-list card hidden" id="history"></div>
  </div>
  <section id="vocabularyPanel" class="card" role="tabpanel" aria-labelledby="vocabularyTab" hidden>
    <h2>개인 영단어장</h2>
    <p class="status">영단어 클릭으로 추가하고, 다시 클릭하면 삭제합니다. 일반 영영사전의 영어 뜻을 조회하며 한국어 뜻은 직접 적을 수 있습니다.</p>
    <p class="status">이 브라우저에만 저장됩니다. 모의고사 시간은 탭을 바꿔도 계속 흐릅니다.</p>
    <div id="vocabularyBrowse">
      <div class="vocabulary-toolbar"><input id="vocabularySearch" type="search" aria-label="단어·한국어 뜻 검색" placeholder="단어·한국어 뜻 검색"><select id="vocabularyFilter" aria-label="단어 학습 상태"><option value="all">전체 단어</option><option value="learning">복습할 단어</option><option value="known">학습 완료</option></select><button id="startVocabularyReview" type="button" class="primary">현재 목록 복습</button></div>
      <p id="vocabularySummary" class="status" aria-live="polite"></p>
      <div id="vocabularyList"></div>
    </div>
    <div id="vocabularyStudy" hidden></div>
  </section>
  <div id="vocabularyNotice" class="vocabulary-notice hidden" role="status" aria-live="polite"></div>
</main>
<script src="local/local.js?v=20261011-checkpoint180"></script>
<script src="vocabulary.js?v=20261011-checkpoint180"></script>
<script>
(() => {
const BANKS = window.QUIZ_BANKS || {};
const EXAMS = { "local-kcna": ["local-kcna"], "local-kcsa": ["local-kcsa"], local: ["local"] };
// Personal questions are the only live pool. Keep the historical selector values so progress keys remain stable.
if (BANKS.local) {
  for (const exam of ["kcna", "kcsa"]) BANKS[`local-${exam}`] = BANKS.local.filter(q => q.exam === exam);
}
const $ = s => document.querySelector(s);
const el = { exam: $("#exam"), mode: $("#mode"), domain: $("#domain"), style: $("#style"), targetKo: $("#target-ko"), targetEn: $("#target-en"), timer: $("#timer"), historyButton: $("#historyButton"), reset: $("#reset"), stats: $("#stats"), card: $("#card"), domains: $("#domains"), result: $("#result"), history: $("#history") };

const pref = (k, v) => v === undefined ? localStorage.getItem("quiz:" + k) : localStorage.setItem("quiz:" + k, v);
const statsKey = () => "quiz:stats:" + el.exam.value;
let stats = {};
const loadStats = () => { try { stats = JSON.parse(localStorage.getItem(statsKey()) || "{}"); } catch { stats = {}; } };
const saveStats = () => localStorage.setItem(statsKey(), JSON.stringify(stats));
const SEEN_KEY = "quiz:seen:local", seenIds = new Set();
let seenError = "";
try {
  const saved = localStorage.getItem(SEEN_KEY);
  const ids = saved == null
    ? ["local-kcna", "local-kcsa", "local"].flatMap(key => Object.keys(JSON.parse(localStorage.getItem("quiz:stats:" + key) || "{}"))).filter(id => /^local-\d+$/.test(id))
    : JSON.parse(saved);
  if (!Array.isArray(ids)) throw new Error("본 문항 기록 형식이 올바르지 않습니다.");
  for (const id of ids) if (typeof id === "string") seenIds.add(id);
} catch (e) { seenError = e.message; }
function saveSeen() {
  if (!seenError) {
    try { localStorage.setItem(SEEN_KEY, JSON.stringify([...seenIds])); }
    catch (e) { seenError = e.message; }
  }
  const notice = $("#seenNotice");
  notice.classList.toggle("hidden", !seenError);
  notice.textContent = seenError ? `본 문항 기록 저장 실패: ${seenError}. 이번 화면의 기록만 사용합니다.` : "";
}
function markSeen(q) {
  if (!seenIds.has(q.id)) { seenIds.add(q.id); saveSeen(); }
}

const base = () => {
  const s = el.style.value;
  const ex = EXAMS[el.exam.value].flatMap(k => BANKS[k] || []);
  return s ? ex.filter(q => (q.style || "study") === s) : ex;
};
function pool() {
  const d = el.domain.value;
  let p = d ? base().filter(q => q.domain === d) : base();
  if (el.mode.value === "wrong") p = p.filter(q => (stats[q.id] || {}).wrong > 0 && (stats[q.id] || {}).streak < 2);
  return p;
}

// After unseen questions are exhausted, favor mistakes and avoid an immediate repeat.
let lastId = null;
function pick(p) {
  if (!p.length) return null;
  let total = 0;
  const w = p.map(q => {
    const s = stats[q.id];
    let x = s?.lastWrong ? 4 : s?.streak >= 3 ? 0.3 : 1;
    if (q.id === lastId && p.length > 1) x = 0;
    total += x; return x;
  });
  let r = Math.random() * total;
  for (let i = 0; i < p.length; i++) { r -= w[i]; if (w[i] > 0 && r <= 0) return p[i]; }
  return p[p.length - 1];
}

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let targetLanguage = "ko", translationShown = false;
const bi = (en, ko, tag = "span", show = false) => {
  const primary = targetLanguage === "ko" ? en : ko, translation = targetLanguage === "ko" ? ko : en;
  const context = ` data-vocabulary-context data-context-en="${esc(en)}" data-context-ko="${esc(ko)}"`;
  return `<${tag} class="primary"${context}>${window.QuizVocabulary.format(primary)}</${tag}><${tag} class="translation${show ? " visible" : ""}"${context}>${window.QuizVocabulary.format(translation)}</${tag}>`;
};

// ---- state ----
let cur = null, order = null, locked = false, currentPicked = null;
let endlessItems = [], endlessIndex = -1;
let exam = null; // {items:[{q,order,picked}], idx, endAt, timerId}
let historyDB = null, historyRecords = [], historyError = "", viewedAttempt = null, viewedAll = false, reviewOverrides = new Map(), attemptSave = null;
const HISTORY_DB = "kcna-kcsa-history", HISTORY_STORE = "attempts";
function openHistoryDB() {
  if (!window.indexedDB) return Promise.reject(new Error("이 브라우저는 IndexedDB를 지원하지 않습니다."));
  if (historyDB) return Promise.resolve(historyDB);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(HISTORY_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(HISTORY_STORE, { keyPath: "id", autoIncrement: true });
    req.onsuccess = () => { historyDB = req.result; resolve(historyDB); };
    req.onerror = () => reject(req.error || new Error("시험 기록 저장소를 열 수 없습니다."));
  });
}
function historyRequest(mode, value) {
  return openHistoryDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(HISTORY_STORE, mode), store = tx.objectStore(HISTORY_STORE);
    const req = mode === "readonly" ? store.getAll() : store.add(value);
    let result;
    req.onsuccess = () => { result = req.result; };
    const fail = () => reject(tx.error || req.error || new Error("시험 기록 저장에 실패했습니다."));
    req.onerror = fail;
    tx.onerror = fail;
    tx.onabort = fail;
    tx.oncomplete = () => resolve(result);
  }));
}
async function loadHistory() {
  try {
    const raw = await historyRequest("readonly") || [];
    const valid = raw.filter(r => r && typeof r.completedAt === "string" && typeof r.examLabel === "string" && Array.isArray(r.items) && r.items.length > 0 && r.items.every(it => it.question && typeof it.question.en === "string" && typeof it.question.ko === "string" && it.choices && Array.isArray(it.choices.en) && Array.isArray(it.choices.ko) && it.explain && typeof it.answer === "number" && Array.isArray(it.order)));
    historyError = valid.length !== raw.length ? "읽을 수 없는 시험 기록이 있어 제외했습니다." : "";
    historyRecords = valid.sort((a, b) => String(b.completedAt).localeCompare(String(a.completedAt)));
  } catch (e) { historyError = e.message; historyRecords = []; }
  renderHistory();
}
function renderHistory() {
  const rows = historyRecords.map((r, i) => `<div class="history-row"><span>${esc(r.examLabel)} · ${esc(new Date(r.completedAt).toLocaleString())} · ${r.right}/${r.total} (${r.percent}%) · ${esc(r.domainContext)}</span><button type="button" data-history-index="${i}">결과 열기</button></div>`).join("");
  el.history.innerHTML = `<h2>시험 기록</h2>${historyError ? `<p class="status">${esc(historyError)}</p>` : ""}${rows || "<p class='status'>완료된 모의고사가 없습니다.</p>"}<p><button id="closeHistory" type="button">현재 퀴즈로 돌아가기</button></p>`;
  el.history.querySelectorAll("[data-history-index]").forEach(b => b.addEventListener("click", () => { reviewOverrides.clear(); renderAttempt(historyRecords[+b.dataset.historyIndex]); }));
  $("#closeHistory").addEventListener("click", closeHistoryView);
}
function closeHistoryView() {
  viewedAttempt = null; viewedAll = false; reviewOverrides.clear();
  el.result.classList.add("hidden"); el.history.classList.add("hidden"); el.historyButton.setAttribute("aria-expanded", "false");
  (cur ? el.card : $("#studySettings")).scrollIntoView({ behavior: "smooth", block: "start" });
  if (cur) el.card.querySelector("#next, #translationToggle")?.focus();
  else $("#studySettings>summary").focus();
}

function renderStats() {
  const p = base();
  const seen = p.filter(q => seenIds.has(q.id)).length;
  let right = 0, total = 0, streak = 0;
  for (const q of p) { const s = stats[q.id]; if (!s) continue; right += s.right; total += s.right + s.wrong; }
  for (const id of (stats.__recent || [])) { if (stats[id] && !stats[id].lastWrong) streak++; else break; }
  const mastered = p.filter(q => (stats[q.id] || {}).streak >= 3).length;
  const wrongNow = p.filter(q => (stats[q.id] || {}).lastWrong).length;
  el.stats.innerHTML = [
    [p.length, "문항 수"], [`${seen} / ${p.length}`, "본 문항"], [total ? Math.round(100 * right / total) + "%" : "–", `정답률 (${right}/${total})`],
    [mastered, "숙달 (3연속 정답)"], [wrongNow, "현재 오답"], [streak, "연속 정답"]
  ].map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");

  const byDom = {};
  for (const q of p) { const d = byDom[q.domain] ||= { n: 0, r: 0, t: 0 }; d.n++; const s = stats[q.id]; if (s) { d.r += s.right; d.t += s.right + s.wrong; } }
  el.domains.innerHTML = Object.entries(byDom).map(([d, v]) => {
    const pct = v.t ? Math.round(100 * v.r / v.t) : 0;
    return `<div class="dom"><span>${esc(d)} <small>(${v.n})</small></span><div class="bar"><i style="width:${pct}%"></i></div><span>${v.t ? pct + "%" : "–"}</span></div>`;
  }).join("");
}

function fillDomains() {
  const ds = [...new Set(EXAMS[el.exam.value].flatMap(k => (BANKS[k] || []).map(q => q.domain)))];
  const keep = el.domain.value;
  el.domain.innerHTML = `<option value="">전체 도메인</option>` + ds.map(d => `<option value="${esc(d)}"${d === keep ? " selected" : ""}>${esc(d)}</option>`).join("");
}

function renderQuestion(q, ord, picked, reveal) {
  const examTag = q.exam === "kcna" || q.id.startsWith("kcna") ? "KCNA" : q.exam === "kcsa" || q.id.startsWith("kcsa") ? "KCSA" : "개인";
  const html = `
    <div class="meta"><span class="tag">${examTag}</span><span class="question-domain">${esc(q.domain)}</span><span class="tag question-id">${q.id}</span>${exam ? `<span class="tag question-position">${exam.idx + 1} / ${exam.items.length}</span>` : endlessItems.length ? `<span class="question-position">${endlessIndex + 1} / ${endlessItems.length}</span>` : ""}</div>
    <p class="q">${bi(q.q.en, q.q.ko, "span", translationShown)}</p>
    <ol class="choices">${ord.map((ci, i) => {
      let cls = "";
      if (reveal) { if (ci === q.answer) cls = "ok"; else if (picked === ci) cls = "bad"; cls += " locked"; }
      else if (picked === ci) cls = "sel";
      return `<li data-ci="${ci}" class="${cls}"><button type="button" class="k" aria-label="${i + 1}번 보기 선택"${reveal ? " disabled" : ""}>${i + 1}</button>${bi(q.choices.en[ci], q.choices.ko[ci], "span", translationShown)}</li>`;
    }).join("")}</ol>
    <div class="explain${reveal ? " show" : ""}">
      <div class="verdict ${picked === q.answer ? "ok" : "bad"}">${picked === q.answer ? "정답" : "오답 — 정답은 " + (ord.indexOf(q.answer) + 1) + "번"}</div>
      ${bi(q.explain.en, q.explain.ko, "div", translationShown)}
      ${q.ref ? `<a href="${esc(q.ref)}" target="_blank" rel="noopener noreferrer">${esc(q.ref)}</a>` : ""}
    </div>
    <div class="actions">
      <button id="translationToggle" type="button" aria-expanded="${translationShown}" aria-pressed="${translationShown}">${targetLanguage === "ko" ? "한국어" : "English"} 번역 ${translationShown ? "숨기기" : "보기"}</button>
      ${exam ? `<button id="prev"${exam.idx === 0 ? " disabled" : ""}>이전</button><button id="next" class="primary">${exam.idx === exam.items.length - 1 ? "제출" : "다음"}</button>`
             : `<button id="prev"${endlessIndex <= 0 ? " disabled" : ""}>이전</button><button id="next" class="primary"${reveal || endlessIndex < endlessItems.length - 1 ? "" : " disabled"}>다음 문제</button>${!reveal && endlessIndex === endlessItems.length - 1 ? `<button id="skip">건너뛰기</button>` : ""}`}
      <span class="hint">영단어: 추가·삭제 · 보기 번호/빈 공간: 답 선택 · 1–4 키${exam ? "" : " · Enter 다음"}</span>
    </div>`;
  el.card.innerHTML = html;
  el.card.querySelectorAll(".choices li").forEach(li => li.addEventListener("click", () => choose(+li.dataset.ci)));
  const tr = $("#translationToggle"); if (tr) tr.addEventListener("click", () => { translationShown = !translationShown; if (!exam && endlessItems[endlessIndex]) endlessItems[endlessIndex].translationShown = translationShown; renderQuestion(cur, order, picked, reveal); $("#translationToggle")?.focus(); });
  const n = $("#next"); if (n) n.addEventListener("click", next);
  const s = $("#skip"); if (s) s.addEventListener("click", () => { lastId = cur.id; nextEndless(); });
  const pv = $("#prev"); if (pv) pv.addEventListener("click", () => { if (exam) { exam.idx--; showExamItem(); } else if (endlessIndex > 0) { endlessIndex--; showEndlessItem(); } });
}

// ---- endless / wrong-only ----
function showEndlessItem() {
  const it = endlessItems[endlessIndex];
  cur = it.q; order = it.order; currentPicked = it.picked;
  locked = it.picked != null; translationShown = it.translationShown;
  markSeen(cur); renderStats();
  renderQuestion(cur, order, currentPicked, locked);
}
function nextEndless() {
  if (endlessIndex < endlessItems.length - 1) { endlessIndex++; showEndlessItem(); return; }
  if (cur) lastId = cur.id;
  const p = pool(), unseen = el.mode.value === "endless" ? p.filter(q => !seenIds.has(q.id)) : [];
  const q = pick(unseen.length ? unseen : p);
  if (!q) {
    if (endlessIndex >= 0) {
      showEndlessItem();
      $("#next").disabled = true;
      return;
    }
    cur = null; order = null; currentPicked = null; locked = false;
    el.card.innerHTML = `<p class="q">${el.mode.value === "wrong" ? "현재 오답으로 남은 문항이 없습니다. 다른 모드를 선택하세요." : "이 조건에 해당하는 문항이 없습니다."}</p>`;
    return;
  }
  endlessItems.push({ q, order: shuffle(q.choices.en.map((_, i) => i)), picked: null, translationShown: false });
  endlessIndex++; showEndlessItem();
}

function record(q, ok) {
  const s = stats[q.id] ||= { right: 0, wrong: 0, streak: 0, lastWrong: false };
  if (ok) { s.right++; s.streak++; s.lastWrong = false; } else { s.wrong++; s.streak = 0; s.lastWrong = true; }
  s.at = Date.now();
  const r = stats.__recent ||= []; r.unshift(q.id); r.length = Math.min(r.length, 50);
  saveStats();
}

function choose(ci) {
  if (exam) { exam.items[exam.idx].picked = ci; currentPicked = ci; renderQuestion(cur, order, ci, false); return; }
  if (locked) return;
  locked = true;
  currentPicked = ci;
  endlessItems[endlessIndex].picked = ci;
  record(cur, ci === cur.answer);
  lastId = cur.id;
  renderStats();
  renderQuestion(cur, order, ci, true);
}

function next() {
  if (exam) { if (exam.idx === exam.items.length - 1) finishExam(); else { exam.idx++; showExamItem(); } return; }
  if (locked || endlessIndex < endlessItems.length - 1) nextEndless();
}

// ---- mock exam ----
const MOCK_WEIGHTS = {
  kcna: { "Kubernetes Fundamentals": 44, "Container Orchestration": 28, "Cloud Native Application Delivery": 16, "Cloud Native Architecture": 12 },
  kcsa: { "Overview of Cloud Native Security": 14, "Kubernetes Cluster Component Security": 22, "Kubernetes Security Fundamentals": 22, "Kubernetes Threat Model": 16, "Platform Security": 16, "Compliance and Security Frameworks": 10 }
};
function sampleMockQuestions(p) {
  if (!p.length) return [];
  const total = Math.min(60, p.length), byDom = {};
  for (const q of p) (byDom[q.domain] ||= []).push(q);
  const weights = MOCK_WEIGHTS[p[0].exam];
  const groups = Object.entries(byDom).map(([domain, qs]) => ({ qs, weight: weights[domain], n: 0 }));
  let active = groups.slice(), remaining = total;
  while (active.length && remaining) {
    const sum = active.reduce((n, g) => n + g.weight, 0);
    const capped = active.filter(g => remaining * g.weight / sum >= g.qs.length);
    if (capped.length) {
      for (const g of capped) { g.n = g.qs.length; remaining -= g.n; }
      active = active.filter(g => g.n < g.qs.length);
      continue;
    }
    for (const g of active) {
      const quota = remaining * g.weight / sum;
      g.n = Math.floor(quota); g.remainder = quota % 1;
    }
    const extra = remaining - active.reduce((n, g) => n + g.n, 0);
    active.sort((a, b) => b.remainder - a.remainder);
    for (let i = 0; i < extra; i++) active[i].n++;
    break;
  }
  return groups.flatMap(g => shuffle(g.qs.slice()).slice(0, g.n));
}
function startExam() {
  if (exam) clearInterval(exam.timerId);
  exam = null; el.timer.classList.add("hidden"); viewedAttempt = null; attemptSave = null;
  locked = false; currentPicked = null; translationShown = false; reviewOverrides.clear();
  const p = el.domain.value ? base().filter(q => q.domain === el.domain.value) : base();
  if (!p.length) {
    cur = null; order = null; locked = false; exam = null;
    el.timer.classList.add("hidden");
    el.card.innerHTML = `<p class="q">이 조건에 해당하는 문항이 없습니다.</p>`;
    return;
  }
  const items = el.exam.value === "local"
    ? ["kcna", "kcsa"].flatMap(kind => sampleMockQuestions(p.filter(q => q.exam === kind)))
    : sampleMockQuestions(p);
  // Each exam contributes up to 60 filtered questions; allow 1.5 minutes per item.
  exam = { items: shuffle(items).map(q => ({ q, order: shuffle([0, 1, 2, 3]), picked: null })), idx: 0, endAt: Date.now() + items.length * 90 * 1000 };
  el.result.classList.add("hidden");
  el.timer.classList.remove("hidden");
  exam.timerId = setInterval(tick, 1000); tick();
  showExamItem();
}
function tick() {
  const left = Math.max(0, exam.endAt - Date.now());
  const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
  el.timer.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  if (left === 0) finishExam();
}
function showExamItem() {
  translationShown = false;
  locked = false;
  const it = exam.items[exam.idx]; currentPicked = it.picked; cur = it.q; order = it.order;
  markSeen(cur); renderStats();
  renderQuestion(cur, order, it.picked, false);
}
function snapshotAttempt(items, right) {
  return {
    completedAt: new Date().toISOString(),
    examKey: el.exam.value,
    examLabel: el.exam.selectedOptions[0].text,
    domainContext: el.domain.value || "전체 도메인",
    styleContext: el.style.value || "전체 유형",
    right, total: items.length, percent: Math.round(100 * right / items.length),
    items: items.map(it => ({ id: it.q.id, exam: it.q.exam, domain: it.q.domain, subtopic: it.q.subtopic || "", difficulty: it.q.difficulty, style: it.q.style || "study", question: { en: it.q.q.en, ko: it.q.q.ko }, choices: { en: it.q.choices.en.slice(), ko: it.q.choices.ko.slice() }, answer: it.q.answer, picked: it.picked, order: it.order.slice(), explain: { en: it.q.explain.en, ko: it.q.explain.ko }, ref: it.q.ref || "" }))
  };
}
function renderAttempt(attempt, allShown = false, options = {}) {
  viewedAttempt = attempt; viewedAll = allShown;
  const byDom = {};
  for (const it of attempt.items) { const d = byDom[it.domain] ||= { r: 0, n: 0 }; d.n++; if (it.picked === it.answer) d.r++; }
  const byExam = {};
  if (attempt.examKey === "local" && attempt.items.every(it => it.exam === "kcna" || it.exam === "kcsa")) {
    for (const it of attempt.items) {
      const e = byExam[it.exam] ||= { r: 0, n: 0 };
      e.n++; if (it.picked === it.answer) e.r++;
    }
  }
  const examScores = ["kcna", "kcsa"].filter(kind => byExam[kind]).map(kind => {
    const e = byExam[kind], pct = Math.round(100 * e.r / e.n);
    return `<tr><th scope="row">${kind.toUpperCase()}</th><td>${e.r}/${e.n}</td><td>${pct}%</td><td class="${pct >= 75 ? "pass" : "fail"}">${pct >= 75 ? "PASS" : "FAIL"}</td></tr>`;
  }).join("");
  const saveStatus = attemptSave && attemptSave.attempt === attempt
    ? `<p id="saveStatus" class="status">${attemptSave.status === "saving" ? "기록 저장 중…" : attemptSave.status === "saved" ? "기록 저장됨" : `기록 저장 실패: ${esc(attemptSave.error)}`}</p>` : "";
  el.result.classList.remove("hidden");
  el.result.innerHTML = `${saveStatus}<h2 class="${attempt.percent >= 75 ? "pass" : "fail"}">${attempt.percent}% — ${attempt.percent >= 75 ? "PASS" : "FAIL"} (연습 기준 75%)</h2>
    <p class="status">연습문제의 점수입니다. 실제 시험 합격 여부나 합격 확률을 뜻하지 않습니다.</p>
    <p>${attempt.right} / ${attempt.total} 정답 · ${esc(new Date(attempt.completedAt).toLocaleString())} · ${esc(attempt.examLabel)} · ${esc(attempt.domainContext)} · ${esc(attempt.styleContext)}</p>
    ${examScores ? `<table id="examScores"><caption>시험별 연습 결과 (기준 75%)</caption><tr><th>시험</th><th>정답</th><th>%</th><th>결과</th></tr>${examScores}</table>` : ""}
    <table><tr><th>도메인</th><th>정답</th><th>%</th></tr>${Object.entries(byDom).map(([d, v]) => `<tr><td>${esc(d)}</td><td>${v.r}/${v.n}</td><td>${Math.round(100 * v.r / v.n)}%</td></tr>`).join("")}</table>
    <div class="review-actions"><button id="allTranslations" type="button" aria-expanded="${allShown}">${targetLanguage === "ko" ? "한국어" : "English"} 번역 ${allShown ? "숨기기" : "모두 보기"}</button><span class="status">각 문항에서도 번역을 열 수 있습니다.</span></div>
    ${attempt.items.map((it, i) => {
      const shown = reviewOverrides.has(i) ? reviewOverrides.get(i) : allShown;
      const choiceHtml = it.order.map((ci, n) => `<li class="${ci === it.answer ? "ok" : ci === it.picked ? "bad" : ""}"><span class="k">${n + 1}</span>${bi(it.choices.en[ci], it.choices.ko[ci], "span", false)}</li>`).join("");
      const picked = it.picked == null ? "무응답" : `${it.order.indexOf(it.picked) + 1}번`;
      return `<div class="review-item${shown ? " translation-on" : ""}" data-review-index="${i}"><div class="meta"><span class="tag">${esc(it.domain)}</span><span class="tag">${esc(it.id)}</span></div><p class="q">${bi(it.question.en, it.question.ko, "span", false)}</p><ol class="choices">${choiceHtml}</ol><p class="review-answer"><b>내 답:</b> ${picked} · <b>${it.picked === it.answer ? "정답" : "정답은 " + (it.order.indexOf(it.answer) + 1) + "번"}</b></p><div class="review-actions"><button type="button" data-review-toggle aria-expanded="${shown}">${targetLanguage === "ko" ? "한국어" : "English"} 번역 ${shown ? "숨기기" : "보기"}</button></div><div class="explain show">${bi(it.explain.en, it.explain.ko, "div", false)}${it.ref ? `<a href="${esc(it.ref)}" target="_blank" rel="noopener noreferrer">${esc(it.ref)}</a>` : ""}</div></div>`;
    }).join("")}
    <button id="closeReview" type="button">현재 퀴즈로 돌아가기</button> <button id="again" class="primary" type="button">다시 모의고사</button>`;
  $("#allTranslations").addEventListener("click", () => {
    viewedAll = !viewedAll; reviewOverrides.clear();
    el.result.querySelectorAll(".review-item").forEach(item => {
      item.classList.toggle("translation-on", viewedAll);
      const b = item.querySelector("[data-review-toggle]"); b.setAttribute("aria-expanded", viewedAll); b.textContent = `${targetLanguage === "ko" ? "한국어" : "English"} 번역 ${viewedAll ? "숨기기" : "보기"}`;
    });
    const all = $("#allTranslations"); all.setAttribute("aria-expanded", viewedAll); all.textContent = `${targetLanguage === "ko" ? "한국어" : "English"} 번역 ${viewedAll ? "숨기기" : "모두 보기"}`; all.focus();
  });
  el.result.querySelectorAll("[data-review-toggle]").forEach(b => b.addEventListener("click", () => {
    const item = b.closest(".review-item"), i = +item.dataset.reviewIndex, on = !item.classList.contains("translation-on");
    reviewOverrides.set(i, on); item.classList.toggle("translation-on", on); b.setAttribute("aria-expanded", on); b.textContent = `${targetLanguage === "ko" ? "한국어" : "English"} 번역 ${on ? "숨기기" : "보기"}`; b.focus();
  }));
  $("#closeReview").addEventListener("click", closeHistoryView);
  $("#again").addEventListener("click", startExam);
  if ($("#quizPanel").hidden) return;
  if (options.scroll === false) {
    if (options.scrollTop != null) window.scrollTo(0, options.scrollTop);
    if (options.reviewIndex != null) {
      const item = el.result.querySelector(`[data-review-index="${options.reviewIndex}"]`); item?.querySelector("[data-review-toggle]")?.focus();
    }
  } else {
    el.result.scrollIntoView({ behavior: "smooth", block: "start" });
    $("#allTranslations").focus();
  }
}
async function persistAttempt(attempt) {
  try {
    const id = await historyRequest("readwrite", attempt);
    attempt.id = id; historyRecords = [attempt, ...historyRecords].sort((a, b) => b.completedAt.localeCompare(a.completedAt)); historyError = ""; renderHistory();
    if (attemptSave && attemptSave.attempt === attempt) attemptSave.status = "saved";
  } catch (e) {
    if (attemptSave && attemptSave.attempt === attempt) { attemptSave.status = "error"; attemptSave.error = e.message; }
  }
  if (viewedAttempt === attempt && !el.result.classList.contains("hidden")) {
    const scrollTop = window.scrollY, active = document.activeElement?.closest?.(".review-item"), reviewIndex = active ? +active.dataset.reviewIndex : null;
    renderAttempt(attempt, viewedAll, { scroll: false, scrollTop, reviewIndex });
  }
}
function finishExam() {
  if (!exam || exam.finished) return;
  exam.finished = true;
  clearInterval(exam.timerId); el.timer.classList.add("hidden");
  let right = 0;
  for (const it of exam.items) { const ok = it.picked === it.q.answer; if (ok) right++; record(it.q, ok); }
  reviewOverrides.clear();
  const attempt = snapshotAttempt(exam.items, right);
  attemptSave = { attempt, status: "saving", error: "" };
  renderAttempt(attempt, false);
  persistAttempt(attempt);
  exam = null;
  cur = null; order = null; currentPicked = null; locked = false;
  el.card.innerHTML = `<p class="q">모의고사 종료. 아래 결과를 확인하세요.</p>`;
  renderStats();
}

// ---- wiring ----
function updateLanguageButtons() {
  el.targetKo.setAttribute("aria-pressed", targetLanguage === "ko");
  el.targetEn.setAttribute("aria-pressed", targetLanguage === "en");
}
function setTarget(lang) {
  targetLanguage = lang; pref("lang", lang); updateLanguageButtons();
  const reviewVisible = viewedAttempt && !el.result.classList.contains("hidden");
  const scrollTop = reviewVisible ? window.scrollY : null;
  const active = reviewVisible ? document.activeElement?.closest?.(".review-item") : null;
  if (cur && order) renderQuestion(cur, order, exam ? exam.items[exam.idx].picked : currentPicked, exam ? false : locked);
  if (reviewVisible) renderAttempt(viewedAttempt, viewedAll, { scroll: false, scrollTop, reviewIndex: active ? +active.dataset.reviewIndex : null });
  if (reviewVisible && !active) (lang === "ko" ? el.targetKo : el.targetEn).focus();
}
function start() {
  const maxQuestions = el.exam.value === "local" ? 120 : 60;
  el.mode.querySelector('option[value="exam"]').textContent = `모의고사 ${maxQuestions}문항 / ${maxQuestions * 1.5}분`;
  if (exam) { clearInterval(exam.timerId); exam = null; el.timer.classList.add("hidden"); }
  viewedAttempt = null; attemptSave = null; el.result.classList.add("hidden");
  endlessItems = []; endlessIndex = -1; lastId = null;
  loadStats(); fillDomains(); renderStats();
  if (el.mode.value === "exam") startExam(); else nextEndless();
}
el.exam.addEventListener("change", () => { pref("exam", el.exam.value); el.domain.value = ""; start(); });
el.mode.addEventListener("change", () => { pref("mode", el.mode.value); start(); });
el.domain.addEventListener("change", start);
el.style.addEventListener("change", () => { pref("style", el.style.value); start(); });
el.targetKo.addEventListener("click", () => setTarget("ko"));
el.targetEn.addEventListener("click", () => setTarget("en"));
el.historyButton.addEventListener("click", () => {
  const open = el.history.classList.toggle("hidden") === false;
  el.historyButton.setAttribute("aria-expanded", open);
  $("#studySettings").open = false;
  if (open) loadHistory().then(() => { el.history.scrollIntoView({ behavior: "smooth", block: "start" }); el.history.querySelector("#closeHistory")?.focus(); });
});
el.reset.addEventListener("click", () => {
  if (!confirm(`${el.exam.selectedOptions[0].text} 진행 통계와 본 문항 기록을 삭제할까요?`)) return;
  localStorage.removeItem(statsKey());
  for (const key of EXAMS[el.exam.value]) for (const q of BANKS[key] || []) seenIds.delete(q.id);
  saveSeen(); start();
});
document.addEventListener("keydown", e => {
  if (e.target.closest("select,button,input,textarea,summary,a,[contenteditable]")) return;
  if ($("#quizPanel").hidden || viewedAttempt || !el.history.classList.contains("hidden")) return;
  if (/^[1-4]$/.test(e.key) && cur && order) { choose(order[+e.key - 1]); e.preventDefault(); }
  else if ((e.key === "Enter" || e.key === " ") && cur) { next(); e.preventDefault(); }
});

const savedExam = pref("exam");
el.exam.value = ["local-kcna", "local-kcsa", "local"].includes(savedExam) ? savedExam : "local-kcna";
el.mode.value = pref("mode") || "endless";
targetLanguage = ["ko", "en"].includes(pref("lang")) ? pref("lang") : "ko";
el.style.value = pref("style") || "";
updateLanguageButtons();
loadHistory();
if (!Object.keys(BANKS).length) el.card.innerHTML = "<p class='q'>local/local.js 가 없습니다.</p>"; else start();
})();
